name: Daily brief

on:
  schedule:
    # GitHub cron is UTC and scheduled runs can be delayed or even dropped in
    # busy windows, so two alarms on odd minutes: whichever fires first builds
    # the brief, the other sees it fresh and exits (guard in run.py).
    - cron: "7 3 * * *"    # ≈ 08:37 IST
    - cron: "52 3 * * *"   # ≈ 09:22 IST, safety net
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # required to commit data/ back to the repo

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Build the digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DFI_MODEL: ${{ vars.DFI_MODEL || '' }}
          DFI_SKIP_IF_FRESH: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python collector/run.py

      - name: Publish
        run: |
          git config user.name  "daily-intel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "brief: $(date -u +%Y-%m-%d)"
          git push
