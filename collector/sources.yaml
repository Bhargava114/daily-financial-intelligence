# ─────────────────────────── market snapshot ───────────────────────────
# Stooq serves free delayed EOD quotes as CSV with no key. Used only for the
# one-line market context strip, not for anything you would trade on.
markets:
  endpoint: https://stooq.com/q/l/?s={symbols}&f=sd2t2ohlcv&h&e=csv
  instruments:
    - {symbol: "^nya",    label: "NYSE Composite"}
    - {symbol: "^spx",    label: "S&P 500"}
    - {symbol: "usdinr",  label: "USD/INR"}
    - {symbol: "cb.f",    label: "Brent"}
    - {symbol: "xauusd",  label: "Gold"}
    - {symbol: "10usy.b", label: "US 10Y"}
