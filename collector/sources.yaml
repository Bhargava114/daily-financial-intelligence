# Daily Financial Intelligence — source registry
#
# tier:      primary  = the regulator/institution's own publication (highest trust)
#            wire     = news agency
#            paper    = business newspaper
#            data     = statistical / market release
# weight:    used to pick the canonical source when several outlets report one event
# ca_bias:   nudges the relevance score for a CA. 0 = neutral, +2 = strongly CA-relevant
# every url is tried in order; the first one that returns items wins.
# a source that fails is skipped and logged — it never breaks the run.

sources:

  # ─────────────────────────── India · primary ───────────────────────────
  - id: rbi_press
    expect_blocked: true   # blocks or times out from cloud runners; kept in case that changes
    name: RBI
    tier: primary
    weight: 10
    ca_bias: 2
    region: india
    urls:
      - "https://website.rbi.org.in/en/web/rbi/-/press-releases?p_l_back_url=%2Fen%2Fweb%2Frbi&_com_liferay_asset_publisher_web_portlet_AssetPublisherPortlet_INSTANCE_ZBRp3ZKNMTOs_rss=1"
      - "https://www.rbi.org.in/Scripts/Rss.aspx?Id=1"
      - https://www.rbi.org.in/pressreleases_rss.xml

  - id: rbi_notifications
    expect_blocked: true   # blocks or times out from cloud runners; kept in case that changes
    name: RBI Notifications
    tier: primary
    weight: 10
    ca_bias: 2
    region: india
    urls:
      - "https://www.rbi.org.in/Scripts/Rss.aspx?Id=2"
      - https://www.rbi.org.in/notifications_rss.xml

  - id: sebi
    name: SEBI
    tier: primary
    weight: 10
    ca_bias: 2
    region: india
    urls:
      - https://www.sebi.gov.in/sebirss.xml
      - "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=1&ssid=6&smid=0"

  # PIB carries the official announcements of Finance Ministry, CBDT, CBIC and the
  # GST Council long before those departments update their own sites. It is the single
  # highest-value Indian feed for a CA and was missing from the original plan.
  - id: pib_finance
    expect_blocked: true   # blocks or times out from cloud runners; kept in case that changes
    name: PIB · Ministry of Finance
    tier: primary
    weight: 9
    ca_bias: 2
    region: india
    urls:
      - "https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3"

  - id: pib_all
    expect_blocked: true   # blocks or times out from cloud runners; kept in case that changes
    name: PIB
    tier: primary
    weight: 8
    ca_bias: 1
    region: india
    urls:
      - "https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=0"

  # ── html-scraped: these regulators publish no feed. selector-based, best effort. ──
  - id: cbdt
    expect_blocked: true   # blocks or times out from cloud runners; kept in case that changes
    name: CBDT / Income Tax
    tier: primary
    weight: 10
    ca_bias: 2
    region: india
    scrape:
      url: https://incometaxindia.gov.in/Pages/communications/index.aspx
      item: "table tr"
      title: "a"
      link: "a"

  - id: cbic_gst
    expect_blocked: true   # blocks or times out from cloud runners; kept in case that changes
    name: CBIC · GST
    tier: primary
    weight: 10
    ca_bias: 2
    region: india
    scrape:
      url: https://www.cbic.gov.in/entities/view-sticker
      item: "ul li"
      title: "a"
      link: "a"

  - id: mca
    expect_blocked: true   # blocks or times out from cloud runners; kept in case that changes
    name: MCA
    tier: primary
    weight: 9
    ca_bias: 2
    region: india
    scrape:
      url: https://www.mca.gov.in/content/mca/global/en/notifications-tender/notifications.html
      item: ".notification-list li, table tr"
      title: "a"
      link: "a"

  - id: icai
    expect_blocked: true   # blocks or times out from cloud runners; kept in case that changes
    name: ICAI
    tier: primary
    weight: 9
    ca_bias: 2
    region: india
    scrape:
      url: https://www.icai.org/category/announcements
      item: ".post, article, li.announcement"
      title: "a"
      link: "a"

  - id: ibbi
    expect_blocked: true   # blocks or times out from cloud runners; kept in case that changes
    name: IBBI
    tier: primary
    weight: 8
    ca_bias: 2
    region: india
    scrape:
      url: https://ibbi.gov.in/en/whats-new
      item: "li, table tr"
      title: "a"
      link: "a"

  # ─────────────────────────── India · press ───────────────────────────
